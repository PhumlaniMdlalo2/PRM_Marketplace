services:
  - type: web
    name: prm-marketplace-backend
    env: java
    rootDir: backend
    buildCommand: ./mvnw clean install -DskipTests
    startCommand: ./mvnw spring-boot:run
    plan: free
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_SIMULATION_ENABLED
        value: false
      - key: IMAGE_STORAGE_DIR
        sync: false
      - key: IMAGE_MAX_BYTES
        value: 5242880

    envVars:
        sync: false
