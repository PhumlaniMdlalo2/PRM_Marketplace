# Test-only overrides. This profile is activated by src/test/resources/application.properties and
# never ships with the application, so it cannot override a real deployment's settings.

# A throwaway signing key. SecurityConfig rejects blank and under-32-byte secrets, so tests must
# supply something of real length. This value is public and intentionally unusable outside tests.
app.jwt.secret=test-only-signing-secret-that-is-long-enough-for-hs256

# Tests run against an in-memory database, so the build does not need MySQL installed.
spring.datasource.url=jdbc:h2:mem:prm_marketplace_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entities. This deliberately avoids db/migration, whose
# MySQL-specific enum(...) DDL that H2 cannot parse. The migration scripts are covered
# separately by FlywayBaselineOnFreshDatabaseTest and SchemaDumpTest.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway only runs in the tests that explicitly exercise the real migration scripts.
spring.flyway.enabled=false

logging.level.org.hibernate.SQL=warn
logging.level.org.flywaydb=warn