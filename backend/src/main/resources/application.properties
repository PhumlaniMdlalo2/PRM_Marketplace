spring.application.name=PRM_Marketplace

spring.datasource.url=jdbc:mysql://localhost:3306/prm_marketplace?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema; Hibernate only verifies the mapping matches it.
# baseline-on-migrate adopts the existing non-empty development database at
# version 1, so V1 only runs against a genuinely fresh database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing development schema
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
# Override in real environments with a 256-bit-or-longer secret, e.g.
# app.jwt.secret=${JWT_SECRET}
app.jwt.secret=change-this-development-signing-secret-value-please
app.jwt.expiration-ms=86400000

# Mail
spring.mail.host=localhost
spring.mail.port=1025

# CORS: comma-separated list of allowed origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.hibernate.SQL=warn