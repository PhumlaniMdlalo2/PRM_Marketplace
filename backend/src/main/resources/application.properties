app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Mail
# Brevo is the default provider for transactional mail. It expects SMTP auth and STARTTLS on the
# relay host; local Mailpit is only used for a developer machine that deliberately overrides these.
# app.mail.from controls the actual From address on the outbound message; spring.mail.username is the
# SMTP login used for authentication, which may be different from the sender address.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-smtp-login}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@prm-marketplace.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# An unreachable mail server does not stop the application from starting. Verification email
# failures are returned as 503 so signup/resend cannot claim delivery; password-reset delivery
# failures are logged without changing the privacy-preserving response. Readiness includes mail.

# Admin accounts are granted out of band, never by self-registration: admin supervises every
# order on the platform, refunds payments and moderates reports, so a self-chosen role is an
# escalation. Naming an address here promotes that account to ADMIN at startup, creating it if it
# does not exist yet.
#
# There is deliberately no default. Left unset, the application starts with no admin account at
# all, which is the correct state for a fresh clone: report moderation, refunds and admin order
# supervision stay unreachable rather than being served by a login published in version control.
#
# Set it to the address you want privileged, e.g.
#   ADMIN_EMAIL=dean@example.ac.za ./mvnw spring-boot:run
# ADMIN_PASSWORD is used only when first creating or promoting the configured account. It is never
# logged or saved in source control. Already-admin accounts are not reset during startup.
app.bootstrap.admin.email=${ADMIN_EMAIL:admin.vendra@gmail.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Explicit success/failure simulation for local development only. Keep disabled in production.
app.payments.simulation.enabled=${PAYMENT_SIMULATION_ENABLED:false}

# CORS: comma-separated list of allowed origins. Wildcards are rejected at startup, because
# combining "*" with credentials would let any site make authenticated cross-origin requests.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Uploaded listing photographs. The service writes bytes into this directory under a name it
# chose, and StorageConfig serves the directory read-only from /api/uploads/images/** - a caller
# supplies content, never a path. IMAGE_STORAGE_DIR points somewhere else when the files have to
# outlive a redeploy (a mounted volume, for instance); the default is relative to where the
# process starts.
app.storage.images-dir=${IMAGE_STORAGE_DIR:./uploads/images}
# The size rule the upload service enforces, checked against the file before anything is written.
# The multipart limits sit just above it so an oversized image still reaches that check and is
# refused with this message, instead of being cut off mid-parse by the container.
app.storage.max-image-bytes=${IMAGE_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.hibernate.SQL=warn

# Health, for a load balancer or container probe. Only health is exposed, and with details hidden it
# reports nothing but up or down: no database URL, no build info, no bean list. Everything else
# under /actuator is not exposed at all and answers 404.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Liveness answers "is this process working", and is the path an orchestrator should probe. Mail is
# deliberately left out of it: a dead mail server is not something restarting this process fixes, so
# including it would have an orchestrator kill and replace a perfectly healthy instance because a
# dependency was down.
management.endpoint.health.group.liveness.include=livenessState

# Readiness answers "can this instance actually serve", and mail counts there. A marketplace that
# cannot send mail cannot complete registration, cannot verify an address and cannot reset a
# password, and until this was split out that state was completely invisible: every send failure was
# logged and swallowed, the request still returned success, and a freshly provisioned admin
# account whose only way in was the reset email was permanently unclaimable with nothing to show it.
management.endpoint.health.group.readiness.include=readinessState,db,mail
server.port=${PORT:8080}
