spring.application.name=PRM_Marketplace

# Credentials come from the environment. The defaults are development-only placeholders so that
# a fresh clone still starts; a real deployment must supply its own values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prm_marketplace?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema; Hibernate only verifies the mapping matches it.
# baseline-on-migrate adopts the existing non-empty development database at
# version 1, so V1 only runs against a genuinely fresh database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing development schema
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
# Off, deliberately. show-sql writes every statement to stdout, which is fine while you are debugging
# and is a steady stream of the entire schema, column names included, in production logs that are
# usually shipped somewhere shared. It also does not respect logging.level.org.hibernate.SQL=warn
# below: show-sql is not an SLF4J setting, so the level that looks like it turns SQL logging off does
# nothing while this is on. To see statements while debugging, set this to true for one run.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
# There is no default on purpose: the application refuses to start without a real secret rather
# than falling back to a value that is public in version control.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail
# The defaults point at Mailpit/MailHog on 1025, which is what a local development setup runs.
# MAIL_USERNAME doubles as the From address, so setting it is what stops verification and reset
# messages going out as the non-routable noreply@prm-marketplace.local.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:noreply@prm-marketplace.local}
# An unreachable mail server does not stop the application from starting, and a send that fails is
# logged and swallowed rather than failing the request. GET /actuator/health/readiness is how you
# find out, because it includes the mail indicator.

# Faculty accounts are granted out of band, never by self-registration: faculty supervises every
# order on the platform, refunds payments and moderates reports, so a self-chosen role is an
# escalation. Naming an address here promotes that account to FACULTY at startup, creating it if it
# does not exist yet.
#
# There is deliberately no default. Left unset, the application starts with no faculty account at
# all, which is the correct state for a fresh clone: report moderation, refunds and faculty order
# supervision stay unreachable rather than being served by a login published in version control.
#
# Set it to the address you want privileged, e.g.
#   FACULTY_EMAIL=dean@example.ac.za ./mvnw spring-boot:run
# If the account does not exist it is created with a random password that is never logged; claim it
# through POST /api/auth/forgot-password. An address that is already faculty is left alone.
app.bootstrap.faculty.email=${FACULTY_EMAIL:}

# CORS: comma-separated list of allowed origins. Wildcards are rejected at startup, because
# combining "*" with credentials would let any site make authenticated cross-origin requests.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.hibernate.SQL=warn

# Health, for a load balancer or container probe. Only health is exposed, and with details hidden it
# reports nothing but up or down: no database URL, no build info, no bean list. Everything else
# under /actuator is not exposed at all and answers 404.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Liveness answers "is this process working", and is the path an orchestrator should probe. Mail is
# deliberately left out of it: a dead mail server is not something restarting this process fixes, so
# including it would have an orchestrator kill and replace a perfectly healthy instance because a
# dependency was down.
management.endpoint.health.group.liveness.include=livenessState

# Readiness answers "can this instance actually serve", and mail counts there. A marketplace that
# cannot send mail cannot complete registration, cannot verify an address and cannot reset a
# password, and until this was split out that state was completely invisible: every send failure was
# logged and swallowed, the request still returned success, and a freshly provisioned faculty
# account whose only way in was the reset email was permanently unclaimable with nothing to show it.
management.endpoint.health.group.readiness.include=readinessState,db,mail